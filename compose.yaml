name: tsframework

services:
  tests:
    image: ${E2E_IMAGE:-tsframework-e2e:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ipc: host
    restart: unless-stopped
    environment:
      CI: "true"
      E2E_BROWSER: ${E2E_BROWSER:-chromium}
    volumes:
      - ./reports:/app/reports
